[project]
name = "matookesmart-companion"
version = "0.1.0"
description = "AI-assisted market intelligence, early-order marketplace and value-addition platform for Uganda's matooke value chain (student prototype)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "MatookeSmart Companion team" }]
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30",
  "SQLAlchemy>=2.0,<3.0",
  "pydantic>=2.7,<3.0",
  "pydantic-settings>=2.3",
  "Jinja2>=3.1",
  "python-multipart>=0.0.9",
  "numpy>=1.26",
  "pandas>=2.2",
  "itsdangerous>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "httpx>=0.27", "ruff>=0.5"]
postgres = ["psycopg[binary]>=3.1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app", "app.engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["ignore::DeprecationWarning:fastapi.testclient:"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
  "E501",   # long lines are handled by the formatter; prose lives in strings
  "B008",   # FastAPI's Depends() in defaults is the documented pattern
  "RUF001", # Ugandan English and Luganda terms use non-ASCII characters
  "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
"app/seed.py" = ["E501"]
