name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx ruff
      - name: Lint
        run: ruff check app tests scripts
      - name: Format check
        run: ruff format --check app tests scripts || (echo "Run: ruff format app tests scripts"; exit 1)
      - name: Import guard (no accidental network or torch dependency)
        run: python -c "import app.main; print('app imports cleanly')"
      - name: Tests
        run: pytest -q

  postgres-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: matooke
          POSTGRES_PASSWORD: matooke
          POSTGRES_DB: matookesmart
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U matooke"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "psycopg[binary]" pytest httpx
      - name: Seed and query against PostgreSQL
        env:
          DATABASE_URL: postgresql+psycopg://matooke:matooke@localhost:5432/matookesmart
        run: |
          python -m app.seed
          python -c "from app.db import SessionLocal; from app import models; db = SessionLocal(); assert db.query(models.Market).count() > 0; assert db.query(models.PriceRecord).count() > 0; print('PostgreSQL seed and query passed'); db.close()"
          pytest -q -k "forecast or order or dashboard"  # tests use their isolated SQLite fixture

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the container
        run: docker build -t matookesmart:ci .
      - name: Smoke test the container
        run: |
          docker run -d --rm --name ms -p 8000:8000 matookesmart:ci
          for i in $(seq 1 30); do
            if curl -fsS localhost:8000/api/v1/health; then ok=1; break; fi
            sleep 2
          done
          docker logs ms
          test -n "$ok"
          docker stop ms
